[package]
name = "raft5fs-utils"
description = "Tools for running raft5fs locally: a whole installation -- store, server and mount -- in one process."
version.workspace = true
edition.workspace = true

[[bin]]
name = "local-fs"
path = "src/bin/local_fs.rs"

[dependencies]
raft5-client = { workspace = true }
raft5-server = { workspace = true }
raft5fs-core = { workspace = true }
raft5fs-crypto = { workspace = true }
raft5fs-fuse = { workspace = true }
raft5fs-server = { workspace = true }
fuser = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "signal"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Minting the cluster's CA and node certificate at bootstrap.
rcgen = "0.14"
# The secrets and passwords, from the OS.
getrandom = "0.4"
base64 = "0.22"
