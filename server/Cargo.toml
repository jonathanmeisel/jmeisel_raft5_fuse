[package]
name = "raft5fs-server"
description = "Filesystem server: serves the raft5fs protocol over a raft5 store. Several can run against one store."
version.workspace = true
edition.workspace = true

[[bin]]
name = "raft5fs-server"
path = "src/main.rs"

[dependencies]
raft5fs-core = { workspace = true }
raft5fs-crypto = { workspace = true }
raft5fs-objstore = { workspace = true }
raft5fs-proto = { workspace = true }
raft5-client = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-stream = { workspace = true }
tonic = { workspace = true }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "1", features = ["derive"] }
libc = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
