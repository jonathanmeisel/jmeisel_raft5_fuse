[package]
name = "raft5fs-web"
description = "The client library for browsers: a JavaScript API over a session, for the web app's Web Worker. Builds only for wasm32; elsewhere it is empty."
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
raft5fs-client = { workspace = true }
raft5fs-crypto = { workspace = true }
raft5fs-proto = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# Pinned: the wasm-bindgen CLI that builds the app must be this version.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
zeroize = "1"
