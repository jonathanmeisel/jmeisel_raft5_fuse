[package]
name = "raft5fs-embed"
description = "Search embeddings on candle, for every client: the text models (a BERT-family encoder, Q8_0) and, for native clients, CLIP's vision side. Built for native clients and for the browser, so both give the same vectors."
version.workspace = true
edition.workspace = true

[features]
# CLIP's vision side: native clients give photos their image vectors.
vision = []

[dependencies]
candle-core = { version = "0.11.1", default-features = false }
candle-nn = { version = "0.11.1", default-features = false }
half = "2.5"
# The tokenizers' pieces: the same crates the `tokenizers` crate uses, so
# token ids match it (tests check they do).
spm_precompiled = "0.1.4"
unicode-segmentation = "1"
unicode_categories = "0.1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# candle's rand needs this (and the flag in .cargo/config.toml) in a
# browser, though nothing here draws random numbers.
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
# Only to check that `tokenize` gives the ids it gives.
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
