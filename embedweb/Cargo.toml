[package]
name = "raft5fs-embed-web"
description = "The search models for the web app's embed Worker, as their own WebAssembly module (raft5fs-embed, built for the browser): queries' vectors, the same as native clients give."
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
raft5fs-embed = { workspace = true }
js-sys = "0.3"
# Checks the models' files as they stream in: WebCrypto hashes only whole
# buffers.
sha2 = "0.10"
# Pinned with raft5fs-web's: the same wasm-bindgen CLI builds both.
wasm-bindgen = "=0.2.129"
