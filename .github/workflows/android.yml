# Builds `raft5fs` for Android (aarch64), to run `raft5fs webdav` under
# Termux (SETUP.txt section 14). FUSE is left out: Android has none for
# ordinary apps. Every run uploads the binary as an artifact; a v* tag also
# attaches it to that release.
name: android

on:
  push:
    tags: ["v*"]
    branches: [master]
    paths:
      - "cli/**"
      - "client/**"
      - "crypto/**"
      - "objstore/**"
      - "proto/**"
      - "webdav/**"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BINARY: raft5fs-android-aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Install the Android target and cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - name: Build
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a --platform 24 build --release \
            -p raft5fs --no-default-features --features webdav
          cp target/aarch64-linux-android/release/raft5fs "$BINARY"
          sha256sum "$BINARY" >"$BINARY.sha256"
          file "$BINARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}
          path: |
            ${{ env.BINARY }}
            ${{ env.BINARY }}.sha256
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "raft5fs $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "$BINARY" "$BINARY.sha256" --clobber
