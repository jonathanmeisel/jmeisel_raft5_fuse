# Runs shellcheck on the deploy scripts whenever they change.
name: deploy scripts

on:
  push:
    paths: ["deploy/**", ".github/workflows/deploy-scripts.yml"]
  pull_request:
    paths: ["deploy/**", ".github/workflows/deploy-scripts.yml"]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update -q && sudo apt-get install -y shellcheck
      - run: deploy/check.sh
