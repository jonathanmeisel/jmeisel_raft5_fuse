# Runs shellcheck on the deploy scripts whenever they change.
name: deploy scripts

on:
  push:
    paths: ["deploy/**", ".github/workflows/deploy-scripts.yml"]
  pull_request:
    paths: ["deploy/**", ".github/workflows/deploy-scripts.yml"]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -q && sudo apt-get install -y shellcheck
      - run: deploy/check.sh
