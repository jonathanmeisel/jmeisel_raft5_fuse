# Tests the workspace, builds the `raft5fs` client for each platform and the
# web app, and on a v* tag publishes the binaries as a release and the web
# app on GitHub Pages.
#
# - test:    formatting, clippy (also of the client for browsers), the
#            whole test suite (FUSE mounts included); on a tag, that the
#            tag matches the Cargo version.
# - build:   only once the tests pass. Each binary is its own workflow
#            artifact. Linux has FUSE (`mount`) and WebDAV; macOS and
#            Android have WebDAV only (no FUSE to build against).
# - web:     the web app: its browser tests (headless Chromium, against a
#            filesystem on the runner), then the site, as a Pages artifact,
#            for the filesystems in the repository variable WEB_CONFIG
#            (deploy/webapp-config.sh prints it), or for the example
#            config while that isn't set.
# - release: on a v* tag only: attaches each binary, and SHA256SUMS, to
#            the release named after the tag.
# - pages:   on a v* tag only, once the repository variable PAGES is
#            "on": publishes the web app (deploy/README.md "Web app"). It
#            refuses to publish the example config.
#
# The web app's code is whatever this workflow publishes, so it is part of
# the app's supply chain: each job gets only the permissions it needs,
# third-party actions are pinned to commits (Dependabot proposes updates),
# and only the protected github-pages environment can publish.
#
# The servers aren't built here: deploy/build.sh builds them from source.
name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
    # Path filters don't apply to tag pushes: every v* tag builds.
    paths:
      - "*/src/**"
      - "*/tests/**"
      - "*/build.rs"
      - "*/Cargo.toml"
      - "proto/proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "webapp/**"
      - ".github/workflows/release.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install FUSE
        # The runner's package list can be older than the mirror: refresh it.
        run: sudo apt-get update -q && sudo apt-get install -y fuse3 libfuse3-dev pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The tag matches the Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "raft5fs") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match the Cargo version $version: bump it in Cargo.toml"
            exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: The client builds for browsers
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy -p raft5fs-client -p raft5fs-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: ""
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            features: --no-default-features --features webdav
          - name: android-aarch64
            os: ubuntu-24.04
            target: aarch64-linux-android
            features: --no-default-features --features webdav
    runs-on: ${{ matrix.os }}
    env:
      BINARY: raft5fs-${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install FUSE headers
        if: matrix.name == 'linux-x86_64'
        run: sudo apt-get update -q && sudo apt-get install -y libfuse3-dev pkg-config
      - name: Install the Android target and cargo-ndk
        if: matrix.name == 'android-aarch64'
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Test the errno translation
        # It only runs where errnos differ from Linux's, so the Linux test
        # job never runs it.
        if: matrix.name == 'macos-aarch64'
        run: cargo test -p raft5fs-proto
      - name: Build
        run: |
          if [ "${{ matrix.name }}" = android-aarch64 ]; then
            export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
            cargo ndk -t arm64-v8a --platform 24 build --release -p raft5fs ${{ matrix.features }}
          else
            cargo build --release --target ${{ matrix.target }} -p raft5fs ${{ matrix.features }}
          fi
          cp "target/${{ matrix.target }}/release/raft5fs" "$BINARY"
          file "$BINARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.BINARY }}
          path: ${{ env.BINARY }}

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: web
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: The wasm target and the wasm-bindgen CLI that web/Cargo.toml pins
        run: |
          rustup target add wasm32-unknown-unknown
          version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"/\1/p' ../web/Cargo.toml)
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $version" ]; then
            cargo install --locked wasm-bindgen-cli --version "$version"
          fi
      - run: npm ci
      - run: npm run wasm
      - name: Browser tests
        run: |
          cargo build -p raft5fs-testkit --example web_dev
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Build the site
        env:
          WEB_CONFIG: ${{ vars.WEB_CONFIG }}
        run: |
          if [ -n "$WEB_CONFIG" ]; then
            printf '%s\n' "$WEB_CONFIG" >config/prod.json
          else
            echo "WEB_CONFIG isn't set: building the example config"
            cp config/example.json config/prod.json
          fi
          npx vite build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: webapp/dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum raft5fs-* >SHA256SUMS
          cat SHA256SUMS
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "raft5fs $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" raft5fs-* SHA256SUMS --clobber

  pages:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PAGES == 'on'
    needs: [test, web]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    # Its deployment rules (repository settings) allow only v* tags.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: The site is for real filesystems
        if: vars.WEB_CONFIG == ''
        run: |
          echo "set the repository variable WEB_CONFIG (deploy/webapp-config.sh) before publishing"
          exit 1
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
