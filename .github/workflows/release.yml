# Tests the workspace, builds the `raft5fs` client for each platform, and
# on a v* tag publishes the binaries as a release.
#
# - test:    formatting, clippy, the whole test suite (FUSE mounts
#            included); on a tag, that the tag matches the Cargo version.
# - build:   only once the tests pass. Each binary is its own workflow
#            artifact. Linux has FUSE (`mount`) and WebDAV; macOS and
#            Android have WebDAV only (no FUSE to build against).
# - release: on a v* tag only: attaches each binary, and SHA256SUMS, to
#            the release named after the tag.
#
# The servers aren't built here: deploy/build.sh builds them from source.
name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
    # Path filters don't apply to tag pushes: every v* tag builds.
    paths:
      - "*/src/**"
      - "*/tests/**"
      - "*/build.rs"
      - "*/Cargo.toml"
      - "proto/proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install FUSE
        # The runner's package list can be older than the mirror: refresh it.
        run: sudo apt-get update -q && sudo apt-get install -y fuse3 libfuse3-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: The tag matches the Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "raft5fs") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match the Cargo version $version: bump it in Cargo.toml"
            exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: ""
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            features: --no-default-features --features webdav
          - name: android-aarch64
            os: ubuntu-24.04
            target: aarch64-linux-android
            features: --no-default-features --features webdav
    runs-on: ${{ matrix.os }}
    env:
      BINARY: raft5fs-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install FUSE headers
        if: matrix.name == 'linux-x86_64'
        run: sudo apt-get update -q && sudo apt-get install -y libfuse3-dev pkg-config
      - name: Install the Android target and cargo-ndk
        if: matrix.name == 'android-aarch64'
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test the errno translation
        # It only runs where errnos differ from Linux's, so the Linux test
        # job never runs it.
        if: matrix.name == 'macos-aarch64'
        run: cargo test -p raft5fs-proto
      - name: Build
        run: |
          if [ "${{ matrix.name }}" = android-aarch64 ]; then
            export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
            cargo ndk -t arm64-v8a --platform 24 build --release -p raft5fs ${{ matrix.features }}
          else
            cargo build --release --target ${{ matrix.target }} -p raft5fs ${{ matrix.features }}
          fi
          cp "target/${{ matrix.target }}/release/raft5fs" "$BINARY"
          file "$BINARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}
          path: ${{ env.BINARY }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum raft5fs-* >SHA256SUMS
          cat SHA256SUMS
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "raft5fs $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" raft5fs-* SHA256SUMS --clobber
