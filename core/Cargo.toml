[package]
name = "raft5fs-core"
description = "The filesystem's store logic: key layout, inode records, batched writes, the read cache. No FUSE."
version.workspace = true
edition.workspace = true

[dependencies]
getrandom = "0.2"
libc = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros"] }
prost = { workspace = true }
raft5-client = { workspace = true }
raft5-shared = { workspace = true }
raft5fs-crypto = { workspace = true }
raft5fs-objstore = { workspace = true }
raft5fs-proto = { workspace = true, features = ["raft5"] }
tracing = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
