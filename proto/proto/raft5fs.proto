// The filesystem protocol between clients and filesystem servers.
//
// **Errors.** Filesystem errors come back inside each response, as `Error {
// errno, message }`, so the client can give the kernel the exact errno. A
// gRPC status always means that the request got no filesystem answer: the
// server was not reachable or failed. That tells the client it can try
// another server.
//
// **Sessions.** Every request except Hello, Prelogin, Login, Enrol, and
// ChangePassword sends a session token from Login, as `authorization:
// Bearer <token>` metadata. The request comes from the user that the
// session belongs to. A missing, forged, or expired session gets
// UNAUTHENTICATED. This is the only status about the request and not the
// server, and it tells the client to log in again.
//
// **Encryption and access.** The client encrypts everything
// (raft5fs-crypto). The server stores and returns data that it cannot open.
//
// - Access is by grant: a grant of a directory gives a user that directory
//   and everything below it, and nothing else. The server checks this on
//   every request.
// - Each inode has a key record (raft5fs-crypto's `NodeKeys`). The server
//   can read only its version numbers. A grant holds the granted
//   directory's key, sealed to the grantee.
// - Each `name` is a tag: an HMAC of the real name under the directory's
//   name key. The server can find an entry without learning its name.
//
// **Snapshots.** The read-only requests (GetAttr, Lookup, Access, ReadDir,
// GetKeyPath, ListGrants, ReadChunks) take a `snapshot`, a name from
// ListSnapshots. They then read the filesystem as it was when the snapshot
// was taken, including the grants that control access. So a user sees in a
// snapshot what they could see at that time. An empty name reads the
// present. A missing snapshot gives ENOENT, and a write to a snapshot gives
// EROFS. The store's administrator takes and removes snapshots, not this
// protocol.
syntax = "proto3";

package raft5fs;

service Fs {
  // What the client needs to know before it buffers writes.
  rpc Hello(HelloRequest) returns (HelloResponse);

  // The password never goes to the server. The client stretches it with the
  // salt and settings from Prelogin, and logs in with the `auth` half (see
  // raft5fs-crypto's `password`).
  rpc Prelogin(PreloginRequest) returns (PreloginResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  // Sets up an account's keys, one time, with a code from an administrator.
  rpc Enrol(EnrolRequest) returns (EmptyResponse);
  // Replaces the parts of an account that come from the password. The key
  // pair does not change.
  rpc ChangePassword(ChangePasswordRequest) returns (EmptyResponse);

  rpc GetAttr(InodeRequest) returns (AttrResponse);
  // Returns the entry's attributes and its sealed name, so the client can
  // check that the name points to that inode.
  rpc Lookup(NameRequest) returns (LookupResponse);
  // Whether the caller can access the inode as `mask` asks. Any grant above
  // the inode allows reads, and a writable grant allows writes.
  rpc Access(AccessRequest) returns (EmptyResponse);
  rpc ReadDir(InodeRequest) returns (ReadDirResponse);
  rpc SetAttr(SetAttrRequest) returns (AttrResponse);
  rpc Mkdir(CreateRequest) returns (AttrResponse);
  rpc Create(CreateRequest) returns (AttrResponse);
  // Both return the inode that was removed.
  rpc Unlink(NameRequest) returns (InoResponse);
  rpc Rmdir(NameRequest) returns (InoResponse);
  // Returns the inode that the move replaced, or 0 if it replaced nothing.
  rpc Rename(RenameRequest) returns (InoResponse);

  // Returns an inode number for a create. A node's key record is bound to
  // its inode, so the client needs the number before it can make the
  // record.
  rpc AllocateInode(NoArgs) returns (InoResponse);
  // Returns the caller's grant above `ino`, and the key record of every
  // node from that grant's directory down to `ino`. This is all the client
  // needs to unwrap `ino`'s key.
  rpc GetKeyPath(InodeRequest) returns (KeyPathResponse);
  // Every grant made to the caller: the entries of their root.
  rpc ListGrants(ListGrantsRequest) returns (GrantListResponse);
  // Every snapshot there is, oldest first.
  rpc ListSnapshots(NoArgs) returns (SnapshotListResponse);
  rpc PublicKey(PublicKeyRequest) returns (PublicKeyResponse);
  // Grants a directory, and everything below it, to a user. It replaces any
  // grant of it that the user had. Needs read-write access to the
  // directory.
  rpc Grant(GrantRequest) returns (EmptyResponse);
  // Makes a new top-level directory, granted read-write to its creator.
  rpc CreateVolume(CreateVolumeRequest) returns (AttrResponse);
  // Removes an empty volume and every grant of it.
  rpc DeleteVolume(InodeRequest) returns (EmptyResponse);

  // File data. The client seals it chunk by chunk (raft5fs-crypto's
  // `data`), so the server cannot read or change it. The client reads,
  // changes, and seals whole chunks again.
  rpc ReadChunks(ReadChunksRequest) returns (ReadChunksResponse);
  // Stores whole sealed chunks, each sealed under the file's current key
  // version. A chunk with an `expected_seq` is stored only if it did not
  // change since the client read it. If any chunk changed, nothing is
  // stored and the answer is EAGAIN: the client reads again and makes its
  // change again.
  rpc WriteChunks(WriteChunksRequest) returns (WriteChunksResponse);
  // Returns names and upload URLs for new blocks of a file in object
  // storage (see ObjectGrid), one for each block asked for. The client
  // seals each block, uploads it, and then stores a BlockRef to it with
  // WriteChunks. Needs a writable grant, like WriteChunks. Returns ENOTSUP
  // if the filesystem keeps no data in object storage.
  rpc PrepareUploads(PrepareUploadsRequest) returns (PrepareUploadsResponse);

  // Returns every node at or below a directory that is granted to anyone,
  // with the path to it and the users that hold its grants. A rotation of
  // the directory's key needs this to keep every grant below it fresh.
  // Needs read-write access to the directory.
  rpc GrantsUnder(InodeRequest) returns (GrantsUnderResponse);
  // Gives nodes new keys in one transaction, from the top down. Each node:
  //
  // - must still be at its expected version;
  // - gets a new key record one version higher, wrapped under its parent's
  //   current key (or the key that this request gives the parent);
  // - has every grant sealed again, or sealed empty to remove it. This is
  //   how a grant is revoked.
  //
  // If anything changed in the meantime, the answer is EAGAIN.
  //
  // Writes that give out or depend on a node's key fail with EKEYEXPIRED
  // while any node from it up to its volume is wrapped under an older
  // version of its parent's key. A user who had that older key, such as a
  // revoked user, could still open it. The writer rotates the stale nodes
  // with this request, then writes again.
  rpc Rotate(RotateRequest) returns (EmptyResponse);

  // Pruning removes key versions that nothing is sealed under (see
  // raft5fs-crypto's `NodeKeys::pruned`). First, everything still under an
  // old version is sealed again under the current one:
  //
  // Seals existing chunks of a file again under its current key version.
  // Each chunk must still be at its `expected_seq`, which is required. If
  // any chunk changed, none are stored and the answer is EAGAIN. The file's
  // size and times do not change, because its contents do not change.
  rpc ResealChunks(ResealChunksRequest) returns (EmptyResponse);
  // Seals directory entry names again under the directory's current key
  // version. Each tag must still point to the same inode, or the answer is
  // EAGAIN. The directory's times do not change.
  rpc ResealNames(ResealNamesRequest) returns (EmptyResponse);
  // Replaces a node's key record with the same record with only its oldest
  // history entries removed. Any other change gives EINVAL. Returns EBUSY
  // while anything (a chunk, an entry name, a child's key, or a grant) is
  // still sealed under a version that the prune removes, and EAGAIN if the
  // record changed in the meantime. Needs read-write access to the node.
  rpc PruneKeys(PruneKeysRequest) returns (EmptyResponse);
}

message NoArgs {}

message Error {
  int32 errno = 1;
  string message = 2;
}

// Time since the Unix epoch.
message Timestamp {
  uint64 secs = 1;
  uint32 nanos = 2;
}

enum Kind {
  KIND_FILE = 0;
  KIND_DIRECTORY = 1;
}

// No owners: grants control access, and a mount shows its own user as the
// owner of everything.
message Attr {
  uint64 ino = 1;
  Kind kind = 2;
  uint64 size = 3;
  uint32 perm = 4;
  uint32 nlink = 5;
  Timestamp atime = 8;
  Timestamp mtime = 9;
  Timestamp ctime = 10;
  // Where the file's data is stored; see ObjectGrid. It does not change
  // after the file is made.
  Layout layout = 11;
}

enum Layout {
  // Every chunk is in the store. This is the layout of every directory, and
  // of every file made before object storage was turned on.
  LAYOUT_INLINE = 0;
  // Chunks below the grid's `from_index` are in the store, and the rest are
  // in object-storage blocks.
  LAYOUT_HYBRID = 1;
}

message HelloRequest {}

message HelloResponse {
  // It never changes for the filesystem.
  uint64 chunk_size = 1;
  // How much contiguous data one write transaction stores. The client
  // buffers up to this much and aligns its batches to multiples of it.
  uint64 batch_bytes = 2;
  // How hybrid-layout files split their data. It never changes for the
  // filesystem. Absent if no data is in object storage.
  ObjectGrid grid = 3;
  // The server's protocol version (`raft5fs_proto::PROTOCOL`). 0 from
  // servers made before it was sent.
  uint32 protocol = 4;
}

// From chunk `from_index` up, a hybrid file stores its chunks `per_block`
// at a time, in one object. Block b holds chunks [from_index + b *
// per_block, from_index + (b + 1) * per_block).
message ObjectGrid {
  uint64 from_index = 1;
  uint32 per_block = 2;
}

message PreloginRequest {
  string username = 1;
}

// How to stretch a password. An account that does not exist gets made-up
// settings, the same each time, so this does not show which accounts exist.
message KdfSettings {
  bytes salt = 1;
  bytes params = 2;
}

message PreloginResponse {
  oneof result {
    KdfSettings settings = 1;
    Error error = 2;
  }
}

message LoginRequest {
  string username = 1;
  bytes auth = 3;
}

message Session {
  string token = 1;
  // When the server stops accepting the token, in seconds since the Unix
  // epoch.
  uint64 expires_at = 2;
  // The account's private key, wrapped under a key that only the password
  // opens.
  bytes wrapped_private_key = 3;
}

message LoginResponse {
  oneof result {
    Session session = 1;
    Error error = 2;
  }
}

// What the server keeps for an account. It can check a login against
// `verifier`, and it can open nothing.
message AccountKeys {
  bytes salt = 1;
  bytes kdf_params = 2;
  bytes verifier = 3;
  bytes public_key = 4;
  bytes wrapped_private_key = 5;
}

message EnrolRequest {
  string username = 1;
  string code = 2;
  AccountKeys keys = 3;
}

// `keys` must keep the account's public key. Only the wrapping changes.
message ChangePasswordRequest {
  string username = 1;
  bytes old_auth = 2;
  AccountKeys keys = 3;
}

message InodeRequest {
  uint64 ino = 1;
  // Read from this snapshot; see the top of this file. Only the read-only
  // requests take one.
  string snapshot = 2;
}

// `mask` is the same as for access(2): R_OK (4), W_OK (2), and X_OK (1)
// ORed together, or 0 to ask only whether the inode exists.
message AccessRequest {
  uint64 ino = 1;
  uint32 mask = 2;
  string snapshot = 3;
}

message NameRequest {
  uint64 parent = 1;
  // The entry's tag.
  bytes name = 2;
  // Only Lookup takes one.
  string snapshot = 3;
}

message CreateRequest {
  uint64 parent = 1;
  // The new entry's tag.
  bytes name = 2;
  uint32 perm = 3;
  // The inode from AllocateInode, and its key record, wrapped under the
  // parent's current key.
  uint64 ino = 4;
  bytes node_keys = 5;
  // The real name, sealed under the parent's key. Listings return it.
  bytes sealed_name = 6;
}

message RenameRequest {
  uint64 parent = 1;
  bytes name = 2;
  uint64 new_parent = 3;
  bytes new_name = 4;
  // Fail with EEXIST if `new_name` exists, and do not replace it.
  bool noreplace = 5;
  // If the parent changes: the moved node's key record, wrapped again under
  // the new parent's current key.
  bytes node_keys = 6;
  // The inode that moves. The server refuses the move if `name` no longer
  // points to it.
  uint64 moved_ino = 7;
  // The real name of `new_name`, sealed under the new parent's key.
  bytes sealed_new_name = 8;
}

message SetTime {
  oneof time {
    bool now = 1;
    Timestamp at = 2;
  }
}

message SetAttrRequest {
  uint64 ino = 1;
  optional uint32 mode = 2;
  // To make a file shorter, the client first seals its new last chunk
  // again, cut short.
  optional uint64 size = 5;
  SetTime atime = 6;
  SetTime mtime = 7;
}

message AttrResponse {
  oneof result {
    Attr attr = 1;
    Error error = 2;
  }
}

message LookedUp {
  Attr attr = 1;
  // As in the directory listing: sealed under the parent's key, and bound
  // to the tag and the inode.
  bytes sealed_name = 2;
}

message LookupResponse {
  oneof result {
    LookedUp entry = 1;
    Error error = 2;
  }
}

// Success unless `error` is set.
message EmptyResponse {
  Error error = 1;
}

message InoResponse {
  oneof result {
    uint64 ino = 1;
    Error error = 2;
  }
}

message DirItem {
  uint64 ino = 1;
  Kind kind = 2;
  // The entry's tag.
  bytes name = 3;
  // The real name, sealed. Empty for `.` and `..`.
  bytes sealed_name = 4;
}

message DirList {
  repeated DirItem items = 1;
}

message ReadDirResponse {
  oneof result {
    DirList list = 1;
    Error error = 2;
  }
}

message GrantInfo {
  uint64 ino = 1;
  bool writable = 2;
  // The version of the directory's key that the grant holds.
  uint32 key_version = 3;
  // The key, sealed to the grantee.
  bytes sealed_key = 4;
  // The label that the grant shows as in the grantee's root, sealed to
  // them.
  bytes sealed_label = 5;
}

message NodeRecord {
  uint64 ino = 1;
  bytes keys = 2;
}

message KeyPath {
  GrantInfo grant = 1;
  // From the granted directory down to the inode in the request.
  repeated NodeRecord nodes = 2;
}

message KeyPathResponse {
  oneof result {
    KeyPath path = 1;
    Error error = 2;
  }
}

message GrantList {
  repeated GrantInfo grants = 1;
}

message GrantListResponse {
  oneof result {
    GrantList list = 1;
    Error error = 2;
  }
}

message ListGrantsRequest {
  string snapshot = 1;
}

message SnapshotInfo {
  string name = 1;
  // When the snapshot was taken, by the clock of the machine that took it.
  Timestamp created = 2;
}

message SnapshotList {
  repeated SnapshotInfo snapshots = 1;
}

message SnapshotListResponse {
  oneof result {
    SnapshotList list = 1;
    Error error = 2;
  }
}

message PublicKeyRequest {
  string username = 1;
}

message PublicKeyResponse {
  oneof result {
    bytes key = 1;
    Error error = 2;
  }
}

message GrantRequest {
  string username = 1;
  GrantInfo grant = 2;
  // The node's grantees with this grantee added, sealed under the node's
  // current key.
  bytes sealed_grantees = 3;
  // The seq of the list that this list was made from (GrantedNode's). The
  // server refuses the grant if the list changed, so a grant made at the
  // same time is not lost.
  uint64 expected_grantees_seq = 4;
}

message CreateVolumeRequest {
  // From AllocateInode.
  uint64 ino = 1;
  uint32 perm = 2;
  // Version 1, with no parent key.
  bytes node_keys = 3;
  // The creator's grant: key version 1, sealed to them.
  bytes sealed_key = 4;
  bytes sealed_label = 5;
  // Its grantees (only the creator), sealed under key version 1.
  bytes sealed_grantees = 6;
}

message ReadChunksRequest {
  uint64 ino = 1;
  uint64 first = 2;
  // At most one write batch. The server cuts a larger request short, and
  // the client asks again from where the answer stopped.
  uint32 count = 3;
  // For chunk `first + i`, the seq that the client already has it at, or 0.
  // A chunk still at that seq comes back `unchanged`, without its bytes.
  repeated uint64 known_seqs = 4;
  string snapshot = 5;
  // The client can fetch chunks from object storage. If this is false, a
  // chunk in object storage gives ENOTSUP, not a hole.
  bool objects_ok = 6;
}

message SealedChunk {
  uint64 index = 1;
  // The store's sequence number for the chunk as read. A write of the chunk
  // sends it, so the server can check that nothing changed the chunk. For a
  // chunk in a block, this is the block's seq.
  uint64 seq = 2;
  // Neither is set for a chunk that was never written (a hole, all zeros),
  // or for an `unchanged` chunk.
  oneof body {
    // The chunk, sealed.
    bytes blob = 3;
    // Where in object storage the sealed chunk is.
    Segment segment = 5;
  }
  // The chunk is still at the seq that the client has.
  bool unchanged = 4;
}

// Segment `segment` of the object that `ChunkList.blocks[block]` names.
message Segment {
  uint32 block = 1;
  uint32 segment = 2;
}

// An object that holds one block: `nseg` sealed chunks, all under key
// version `version`. Each chunk is padded with zeros to the chunk size
// before sealing, so segment j starts at byte j * (chunk size + sealing
// overhead).
message BlockRef {
  uint32 version = 1;
  uint64 minted_ms = 2;
  bytes random = 3;
  uint32 nseg = 4;
}

message BlockUrl {
  BlockRef block = 1;
  // A presigned GET for the object. It works for any range of the object.
  string url = 2;
}

message ChunkList {
  // The file's attributes, for its size.
  Attr attr = 1;
  repeated SealedChunk chunks = 2;
  // The blocks that `chunks` refer to.
  repeated BlockUrl blocks = 3;
}

message ReadChunksResponse {
  oneof result {
    ChunkList list = 1;
    Error error = 2;
  }
}

message ChunkWrite {
  uint64 index = 1;
  // Absent for a chunk that the write replaces completely.
  optional uint64 expected_seq = 2;
  oneof body {
    bytes blob = 3;
    // A block uploaded through PrepareUploads, at the block's first index.
    BlockRef block = 4;
  }
}

message WriteChunksRequest {
  uint64 ino = 1;
  repeated ChunkWrite chunks = 2;
  // The file grows to at least this size, the end of what was written. 0
  // leaves the size as it is.
  uint64 end = 3;
}

message ChunksWritten {
  Attr attr = 1;
  // The seq of every chunk written.
  uint64 seq = 2;
}

message WriteChunksResponse {
  oneof result {
    ChunksWritten written = 1;
    Error error = 2;
  }
}

message Grantee {
  string username = 1;
  // The key that the server has. Check it against the key pinned before.
  bytes public_key = 2;
  bool writable = 3;
}

message GrantedNode {
  uint64 ino = 1;
  // From the directory in the request down to this node, both included.
  repeated uint64 path = 2;
  repeated Grantee grantees = 3;
  // The users that its key holders say it is granted to, sealed under its
  // key.
  bytes sealed_grantees = 4;
  // The store's sequence number for that list. A grant that changes the
  // list sends the seq it started from.
  uint64 grantees_seq = 5;
}

message GrantedNodes {
  repeated GrantedNode nodes = 1;
}

message GrantsUnderResponse {
  oneof result {
    GrantedNodes list = 1;
    Error error = 2;
  }
}

message ResealedGrant {
  string username = 1;
  // The node's new key, sealed to the grantee. Empty to remove their grant.
  bytes sealed_key = 2;
}

message Rotation {
  uint64 ino = 1;
  uint32 expected_version = 2;
  bytes node_keys = 3;
  repeated ResealedGrant grants = 4;
  // Its grantees after the rotation, sealed under the new key. Empty if no
  // grantees are left.
  bytes sealed_grantees = 5;
}

message RotateRequest {
  // Parents before children.
  repeated Rotation rotations = 1;
}

message PrepareUploadsRequest {
  uint64 ino = 1;
  repeated BlockUpload blocks = 2;
}

message BlockUpload {
  // The block's first chunk index.
  uint64 index = 1;
  // How many segments the object holds. This sets its length.
  uint32 nseg = 2;
}

message PreparedUpload {
  // The object's name, for the BlockRef that stores it.
  uint64 minted_ms = 1;
  bytes random = 2;
  // A presigned PUT for exactly the block's length. It works one time.
  string url = 3;
}

message PreparedUploads {
  repeated PreparedUpload uploads = 1;
}

message PrepareUploadsResponse {
  oneof result {
    PreparedUploads uploads = 1;
    Error error = 2;
  }
}

message ResealChunksRequest {
  uint64 ino = 1;
  repeated ChunkWrite chunks = 2;
}

message ResealedName {
  // The tag that the entry is filed under.
  bytes name = 1;
  // The inode that the entry must still point to.
  uint64 ino = 2;
  bytes sealed_name = 3;
}

message ResealNamesRequest {
  uint64 dir = 1;
  repeated ResealedName names = 2;
}

message PruneKeysRequest {
  uint64 ino = 1;
  // The record's current version. Any other version gives EAGAIN.
  uint32 expected_version = 2;
  bytes node_keys = 3;
}

// A backup's manifest, stored in the backup space after everything else
// the backup holds (see raft5fs-core's `backup`). A backup exists if and
// only if its manifest does. Not part of the protocol: only servers and
// admin tools read it.
message BackupManifest {
  uint32 format = 1;
  // The snapshot the backup was taken from, which is also its name.
  string name = 2;
  uint64 snapshot_seq = 3;
  uint64 created_unix_ms = 4;
  // The filesystem's object grid, if it keeps blocks in object storage.
  uint64 grid_from_index = 5;
  uint32 grid_per_block = 6;
  // The data key, sealed to the operator's public key.
  bytes sealed_data_key = 7;
  repeated BackupPart parts = 8;
  repeated BackupObject objects = 9;
}

// One part of the store's backup file, sealed under the data key.
message BackupPart {
  uint64 plain_len = 1;
  uint64 sealed_len = 2;
  // SHA-256 of the sealed part.
  bytes sha256 = 3;
}

// An object the backup's snapshot points to, in the backup's object pool.
message BackupObject {
  uint64 ino = 1;
  uint64 minted_ms = 2;
  bytes random = 3;
  uint64 size = 4;
}
