// The filesystem protocol between FUSE clients and filesystem servers.
//
// Filesystem errors travel in-band, as `Error { errno, message }` inside
// each response, so the client can hand the kernel the exact errno. A
// gRPC status, by contrast, always means the request didn't get a
// filesystem answer at all -- the server was unreachable or failed --
// which is what tells the client it may try another server.
//
// Every request but Hello, Prelogin, Login, Enrol and ChangePassword
// carries a session token from Login, as `authorization: Bearer <token>`
// metadata; who the request is from is whoever that session belongs to.
// A missing, forged or expired session is refused with UNAUTHENTICATED --
// the one status that is about the request rather than the server, and
// the client's cue to log in again.
//
// Everything is encrypted on the client (raft5fs-crypto): the server
// stores and hands back what it can't open. Access is by grant: a user
// reaches a directory, and everything under it, through a grant of it to
// them, and only what lies under their grants -- checked on every
// request. Every inode has a key record (raft5fs-crypto's `NodeKeys`),
// opaque to the server but for its version numbers; a grant carries the
// granted directory's key sealed to the grantee. Every `name` is a tag:
// an HMAC of the real name under the directory's name key, which lets the
// server find an entry without learning what it is called.
//
// Snapshots: the read-only requests (GetAttr, Lookup, Access, ReadDir,
// GetKeyPath, ListGrants, ReadChunks) take a `snapshot`, the name of one
// ListSnapshots lists, to read the filesystem as it was when it was taken
// rather than as it is -- all of it, the grants that decide access
// included, so what a user sees in one is what they could see then.
// Empty reads the present. One that doesn't exist is ENOENT, and anything
// that would write at one EROFS. Snapshots are taken and removed by the
// store's administrator, not through this protocol.
syntax = "proto3";

package raft5fs;

service Fs {
  // What the client needs to know before buffering writes.
  rpc Hello(HelloRequest) returns (HelloResponse);

  // The password never reaches the server: the client stretches it with
  // the salt and parameters from Prelogin and logs in with the `auth`
  // half (see raft5fs-crypto's `password`).
  rpc Prelogin(PreloginRequest) returns (PreloginResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  // Sets up an account's keys, once, with a code an administrator issued.
  rpc Enrol(EnrolRequest) returns (EmptyResponse);
  // Replaces an account's password-derived material; the key pair stays.
  rpc ChangePassword(ChangePasswordRequest) returns (EmptyResponse);

  rpc GetAttr(InodeRequest) returns (AttrResponse);
  // The entry's attributes, with its sealed name, for the client to check
  // the name really names that inode.
  rpc Lookup(NameRequest) returns (LookupResponse);
  // Whether the caller may access the inode as `mask` asks: any grant
  // over it reads, a writable one writes.
  rpc Access(AccessRequest) returns (EmptyResponse);
  rpc ReadDir(InodeRequest) returns (ReadDirResponse);
  rpc SetAttr(SetAttrRequest) returns (AttrResponse);
  rpc Mkdir(CreateRequest) returns (AttrResponse);
  rpc Create(CreateRequest) returns (AttrResponse);
  // Both return the inode removed.
  rpc Unlink(NameRequest) returns (InoResponse);
  rpc Rmdir(NameRequest) returns (InoResponse);
  // Returns the inode the move replaced, or 0 if it replaced nothing.
  rpc Rename(RenameRequest) returns (InoResponse);

  // An inode number to create with: a node's key record is bound to its
  // inode, so the client needs the number before it can make one.
  rpc AllocateInode(NoArgs) returns (InoResponse);
  // The caller's grant over `ino`, and the key record of every node from
  // that grant's directory down to `ino`: what it takes to unwrap `ino`'s
  // key from scratch.
  rpc GetKeyPath(InodeRequest) returns (KeyPathResponse);
  // Every grant made to the caller: the entries of their root.
  rpc ListGrants(ListGrantsRequest) returns (GrantListResponse);
  // Every snapshot there is, oldest first.
  rpc ListSnapshots(NoArgs) returns (SnapshotListResponse);
  rpc PublicKey(PublicKeyRequest) returns (PublicKeyResponse);
  // Grants a directory (and all under it) to a user, replacing any grant
  // of it they had. Needs read-write access to it.
  rpc Grant(GrantRequest) returns (EmptyResponse);
  // A new top-level directory, granted read-write to its creator.
  rpc CreateVolume(CreateVolumeRequest) returns (AttrResponse);
  // Removes an empty volume, and every grant of it.
  rpc DeleteVolume(InodeRequest) returns (EmptyResponse);

  // File data, which the client seals chunk by chunk (raft5fs-crypto's
  // `data`), so the server can neither read it nor patch it: the client
  // reads, changes and re-seals whole chunks.
  rpc ReadChunks(ReadChunksRequest) returns (ReadChunksResponse);
  // Stores whole sealed chunks, each sealed under the file's current key
  // version. A chunk with an `expected_seq` is stored only if it is still
  // as the client read it -- otherwise nothing is, and the answer is
  // EAGAIN, for the client to read again and redo its change.
  rpc WriteChunks(WriteChunksRequest) returns (WriteChunksResponse);
  // Names and upload URLs for new blocks of a file in object storage
  // (see ObjectGrid), one per block asked for. The client seals each
  // block, uploads it, then stores a BlockRef to it with WriteChunks.
  // Needs a writable grant, like WriteChunks; ENOTSUP if the filesystem
  // keeps no data in object storage.
  rpc PrepareUploads(PrepareUploadsRequest) returns (PrepareUploadsResponse);

  // Every node at or under a directory that is granted to anyone, with
  // the path down to it and who holds the grants: what rotating the
  // directory's key -- and keeping every grant below it fresh -- needs.
  // Needs read-write access to the directory.
  rpc GrantsUnder(InodeRequest) returns (GrantsUnderResponse);
  // Gives nodes new keys, in one transaction, top down. Each must still be
  // at its expected version, its new key record one version on and
  // wrapped under its parent's key as it is now (or as this same request
  // leaves it), and every grant of it re-sealed -- or, sealed empty,
  // removed, which is how a grant is revoked. Anything changed meanwhile
  // is EAGAIN.
  //
  // Writes that hand out or depend on a node's key are refused with
  // EKEYEXPIRED while any node from it up to its volume is wrapped under
  // an older version of its parent's key: someone who held that older key
  // -- someone revoked -- could still open it. The writer rotates the
  // stale nodes with this, then writes again.
  rpc Rotate(RotateRequest) returns (EmptyResponse);

  // Pruning: dropping key versions nothing is sealed under any more (see
  // raft5fs-crypto's `NodeKeys::pruned`). Everything still under an old
  // version is first sealed again under the current one:
  //
  // Re-seals existing chunks of a file under its current key version,
  // each only if still at its `expected_seq` (which is required) --
  // otherwise none are, and the answer is EAGAIN. The file's size and
  // times stay as they were: its contents haven't changed.
  rpc ResealChunks(ResealChunksRequest) returns (EmptyResponse);
  // Re-seals directory entries' names under the directory's current key
  // version, each only if its tag still names the same inode (EAGAIN if
  // not). The directory's times stay as they were.
  rpc ResealNames(ResealNamesRequest) returns (EmptyResponse);
  // Replaces a node's key record with the same record cut short: only
  // its oldest history entries gone, anything else EINVAL. Refused with
  // EBUSY while anything -- a chunk, an entry name, a child's key, a grant
  // -- is still sealed under a version it drops, and EAGAIN if the record
  // changed meanwhile. Needs read-write access to the node.
  rpc PruneKeys(PruneKeysRequest) returns (EmptyResponse);
}

message NoArgs {}

message Error {
  int32 errno = 1;
  string message = 2;
}

// Time since the Unix epoch.
message Timestamp {
  uint64 secs = 1;
  uint32 nanos = 2;
}

enum Kind {
  KIND_FILE = 0;
  KIND_DIRECTORY = 1;
}

// No owners: access goes by grants, and a mount shows its own user as the
// owner of everything.
message Attr {
  uint64 ino = 1;
  Kind kind = 2;
  uint64 size = 3;
  uint32 perm = 4;
  uint32 nlink = 5;
  Timestamp atime = 8;
  Timestamp mtime = 9;
  Timestamp ctime = 10;
  // Where the file's data lives; see ObjectGrid. Fixed at creation.
  Layout layout = 11;
}

enum Layout {
  // Every chunk in the store: all files made before object storage was
  // turned on, and every directory.
  LAYOUT_INLINE = 0;
  // Chunks below the grid's `from_index` in the store, the rest in
  // object-storage blocks.
  LAYOUT_HYBRID = 1;
}

message HelloRequest {}

message HelloResponse {
  // Fixed for the filesystem's lifetime.
  uint64 chunk_size = 1;
  // How much contiguous data one write transaction stores: the client
  // buffers up to this much and aligns its batches to multiples of it.
  uint64 batch_bytes = 2;
  // How hybrid-layout files split their data, fixed for the filesystem's
  // lifetime; absent if no data lives in object storage.
  ObjectGrid grid = 3;
}

// From chunk `from_index` on, a hybrid file's chunks are stored
// `per_block` at a time as one object: block b holds chunks
// [from_index + b * per_block, from_index + (b + 1) * per_block).
message ObjectGrid {
  uint64 from_index = 1;
  uint32 per_block = 2;
}

message PreloginRequest {
  string username = 1;
}

// How to stretch a password. An account that doesn't exist gets made-up
// settings, the same every time, so this doesn't say which accounts do.
message KdfSettings {
  bytes salt = 1;
  bytes params = 2;
}

message PreloginResponse {
  oneof result {
    KdfSettings settings = 1;
    Error error = 2;
  }
}

message LoginRequest {
  string username = 1;
  bytes auth = 3;
}

message Session {
  string token = 1;
  // When the token stops being accepted, in seconds since the Unix epoch.
  uint64 expires_at = 2;
  // The account's private key, wrapped under the key only the password
  // opens.
  bytes wrapped_private_key = 3;
}

message LoginResponse {
  oneof result {
    Session session = 1;
    Error error = 2;
  }
}

// What the server keeps for an account: it can check a login against
// `verifier`, and opens nothing.
message AccountKeys {
  bytes salt = 1;
  bytes kdf_params = 2;
  bytes verifier = 3;
  bytes public_key = 4;
  bytes wrapped_private_key = 5;
}

message EnrolRequest {
  string username = 1;
  string code = 2;
  AccountKeys keys = 3;
}

// `keys` must keep the account's public key: only the wrapping changes.
message ChangePasswordRequest {
  string username = 1;
  bytes old_auth = 2;
  AccountKeys keys = 3;
}

message InodeRequest {
  uint64 ino = 1;
  // Read as of this snapshot; see the top of this file. Only the
  // read-only requests take one.
  string snapshot = 2;
}

// `mask` is access(2)'s: R_OK (4), W_OK (2) and X_OK (1) ORed, or 0 to
// ask only whether the inode exists.
message AccessRequest {
  uint64 ino = 1;
  uint32 mask = 2;
  string snapshot = 3;
}

message NameRequest {
  uint64 parent = 1;
  // The entry's tag.
  bytes name = 2;
  // Only Lookup takes one.
  string snapshot = 3;
}

message CreateRequest {
  uint64 parent = 1;
  // The new entry's tag.
  bytes name = 2;
  uint32 perm = 3;
  // The inode AllocateInode gave, and its key record, wrapped under the
  // parent's current key.
  uint64 ino = 4;
  bytes node_keys = 5;
  // The real name, sealed under the parent's key, which listings hand
  // back.
  bytes sealed_name = 6;
}

message RenameRequest {
  uint64 parent = 1;
  bytes name = 2;
  uint64 new_parent = 3;
  bytes new_name = 4;
  // Fail with EEXIST rather than replace an existing `new_name`.
  bool noreplace = 5;
  // When the parent changes: the moved node's key record, re-wrapped
  // under the new parent's current key.
  bytes node_keys = 6;
  // The inode moving -- the move is refused if `name` no longer names it.
  uint64 moved_ino = 7;
  // `new_name`'s real name, sealed under the new parent's key.
  bytes sealed_new_name = 8;
}

message SetTime {
  oneof time {
    bool now = 1;
    Timestamp at = 2;
  }
}

message SetAttrRequest {
  uint64 ino = 1;
  optional uint32 mode = 2;
  // A shrink's last chunk the client has re-sealed, cut short, already.
  optional uint64 size = 5;
  SetTime atime = 6;
  SetTime mtime = 7;
}

message AttrResponse {
  oneof result {
    Attr attr = 1;
    Error error = 2;
  }
}

message LookedUp {
  Attr attr = 1;
  // As the directory listing has it: sealed under the parent's key, bound
  // to the tag and the inode.
  bytes sealed_name = 2;
}

message LookupResponse {
  oneof result {
    LookedUp entry = 1;
    Error error = 2;
  }
}

// Success unless `error` is set.
message EmptyResponse {
  Error error = 1;
}

message InoResponse {
  oneof result {
    uint64 ino = 1;
    Error error = 2;
  }
}

message DirItem {
  uint64 ino = 1;
  Kind kind = 2;
  // The entry's tag.
  bytes name = 3;
  // The real name, sealed; empty for `.` and `..`.
  bytes sealed_name = 4;
}

message DirList {
  repeated DirItem items = 1;
}

message ReadDirResponse {
  oneof result {
    DirList list = 1;
    Error error = 2;
  }
}

message GrantInfo {
  uint64 ino = 1;
  bool writable = 2;
  // The version of the directory's key the grant holds.
  uint32 key_version = 3;
  // The key, sealed to the grantee.
  bytes sealed_key = 4;
  // What the grant shows up as in the grantee's root, sealed to them.
  bytes sealed_label = 5;
}

message NodeRecord {
  uint64 ino = 1;
  bytes keys = 2;
}

message KeyPath {
  GrantInfo grant = 1;
  // From the granted directory down to the inode asked about.
  repeated NodeRecord nodes = 2;
}

message KeyPathResponse {
  oneof result {
    KeyPath path = 1;
    Error error = 2;
  }
}

message GrantList {
  repeated GrantInfo grants = 1;
}

message GrantListResponse {
  oneof result {
    GrantList list = 1;
    Error error = 2;
  }
}

message ListGrantsRequest {
  string snapshot = 1;
}

message SnapshotInfo {
  string name = 1;
  // When it was taken, by the clock of whoever took it.
  Timestamp created = 2;
}

message SnapshotList {
  repeated SnapshotInfo snapshots = 1;
}

message SnapshotListResponse {
  oneof result {
    SnapshotList list = 1;
    Error error = 2;
  }
}

message PublicKeyRequest {
  string username = 1;
}

message PublicKeyResponse {
  oneof result {
    bytes key = 1;
    Error error = 2;
  }
}

message GrantRequest {
  string username = 1;
  GrantInfo grant = 2;
  // The node's grantees with this one added, sealed under its current key.
  bytes sealed_grantees = 3;
  // The seq of the list this one was made from (GrantedNode's): refused
  // if it changed meanwhile, so no grant made at the same time is lost
  // from it.
  uint64 expected_grantees_seq = 4;
}

message CreateVolumeRequest {
  // From AllocateInode.
  uint64 ino = 1;
  uint32 perm = 2;
  // Version 1, with no parent key.
  bytes node_keys = 3;
  // The creator's grant: key version 1, sealed to them.
  bytes sealed_key = 4;
  bytes sealed_label = 5;
  // Its grantees, the creator alone, sealed under key version 1.
  bytes sealed_grantees = 6;
}

message ReadChunksRequest {
  uint64 ino = 1;
  uint64 first = 2;
  // At most what one write batch holds; more is cut short, and the client
  // asks again from where the answer stopped.
  uint32 count = 3;
  // For chunk `first + i`, the seq the client already holds it at, or 0.
  // A chunk still at it comes back `unchanged`, without its bytes.
  repeated uint64 known_seqs = 4;
  string snapshot = 5;
  // The client can fetch chunks from object storage. Without it, a chunk
  // that lives there is ENOTSUP rather than coming back as a hole.
  bool objects_ok = 6;
}

message SealedChunk {
  uint64 index = 1;
  // The store's sequence number for the chunk as read: what a write of it
  // expects, to be sure nothing changed it meanwhile. For a chunk in a
  // block, the block's.
  uint64 seq = 2;
  // Neither, for a chunk that was never written -- a hole, all zeros --
  // or one `unchanged`.
  oneof body {
    // The chunk, sealed.
    bytes blob = 3;
    // Where in object storage the sealed chunk is.
    Segment segment = 5;
  }
  // Still at the seq the client said it held.
  bool unchanged = 4;
}

// Segment `segment` of the object `ChunkList.blocks[block]` names.
message Segment {
  uint32 block = 1;
  uint32 segment = 2;
}

// An object holding one block: `nseg` sealed chunks, each zero-padded to
// the chunk size before sealing, so segment j is at byte j * (chunk size
// + sealing overhead). All sealed under key version `version`.
message BlockRef {
  uint32 version = 1;
  uint64 minted_ms = 2;
  bytes random = 3;
  uint32 nseg = 4;
}

message BlockUrl {
  BlockRef block = 1;
  // A presigned GET for the object, good for any range of it.
  string url = 2;
}

message ChunkList {
  // The file's attributes, for its size.
  Attr attr = 1;
  repeated SealedChunk chunks = 2;
  // The blocks `chunks` refer to.
  repeated BlockUrl blocks = 3;
}

message ReadChunksResponse {
  oneof result {
    ChunkList list = 1;
    Error error = 2;
  }
}

message ChunkWrite {
  uint64 index = 1;
  // Absent for a chunk being replaced whole, whatever it held.
  optional uint64 expected_seq = 2;
  oneof body {
    bytes blob = 3;
    // A block uploaded through PrepareUploads, at a block's first index.
    BlockRef block = 4;
  }
}

message WriteChunksRequest {
  uint64 ino = 1;
  repeated ChunkWrite chunks = 2;
  // The file grows to at least this, the end of what was written; 0 to
  // leave its size alone.
  uint64 end = 3;
}

message ChunksWritten {
  Attr attr = 1;
  // The seq every chunk written is now at.
  uint64 seq = 2;
}

message WriteChunksResponse {
  oneof result {
    ChunksWritten written = 1;
    Error error = 2;
  }
}

message Grantee {
  string username = 1;
  // As the server has it: check it against what was pinned before.
  bytes public_key = 2;
  bool writable = 3;
}

message GrantedNode {
  uint64 ino = 1;
  // From the directory asked about down to this node, both included.
  repeated uint64 path = 2;
  repeated Grantee grantees = 3;
  // Who its key holders say it is granted to, sealed under its key.
  bytes sealed_grantees = 4;
  // The store's sequence number for that list: what a grant changing it
  // says it started from.
  uint64 grantees_seq = 5;
}

message GrantedNodes {
  repeated GrantedNode nodes = 1;
}

message GrantsUnderResponse {
  oneof result {
    GrantedNodes list = 1;
    Error error = 2;
  }
}

message ResealedGrant {
  string username = 1;
  // The node's new key sealed to them; empty to remove their grant.
  bytes sealed_key = 2;
}

message Rotation {
  uint64 ino = 1;
  uint32 expected_version = 2;
  bytes node_keys = 3;
  repeated ResealedGrant grants = 4;
  // Its grantees as the rotation leaves them, sealed under the new key;
  // empty if it leaves none.
  bytes sealed_grantees = 5;
}

message RotateRequest {
  // Parents before children.
  repeated Rotation rotations = 1;
}

message PrepareUploadsRequest {
  uint64 ino = 1;
  repeated BlockUpload blocks = 2;
}

message BlockUpload {
  // The block's first chunk index.
  uint64 index = 1;
  // How many segments the object will hold, which fixes its length.
  uint32 nseg = 2;
}

message PreparedUpload {
  // The object's name, for the BlockRef that stores it.
  uint64 minted_ms = 1;
  bytes random = 2;
  // A presigned PUT, for exactly the block's length, usable once.
  string url = 3;
}

message PreparedUploads {
  repeated PreparedUpload uploads = 1;
}

message PrepareUploadsResponse {
  oneof result {
    PreparedUploads uploads = 1;
    Error error = 2;
  }
}

message ResealChunksRequest {
  uint64 ino = 1;
  repeated ChunkWrite chunks = 2;
}

message ResealedName {
  // The entry's tag, as it is filed under.
  bytes name = 1;
  // The inode it must still name.
  uint64 ino = 2;
  bytes sealed_name = 3;
}

message ResealNamesRequest {
  uint64 dir = 1;
  repeated ResealedName names = 2;
}

message PruneKeysRequest {
  uint64 ino = 1;
  // The version the record is at: anything else is EAGAIN.
  uint32 expected_version = 2;
  bytes node_keys = 3;
}
