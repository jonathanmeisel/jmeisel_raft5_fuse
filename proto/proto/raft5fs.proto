// The filesystem protocol between FUSE clients and filesystem servers.
//
// Filesystem errors travel in-band, as `Error { errno, message }` inside
// each response, so the client can hand the kernel the exact errno. A
// gRPC status, by contrast, always means the request didn't get a
// filesystem answer at all -- the server was unreachable or failed --
// which is what tells the client it may try another server.
//
// Every request but Hello, Prelogin, Login, Enrol and ChangePassword
// carries a session token from Login,
// as `authorization: Bearer <token>` metadata; who the request is from is
// whoever that session belongs to. A missing, forged or expired session
// is refused with UNAUTHENTICATED -- the one status that is about the
// request rather than the server, and the client's cue to log in again.
//
// Reading and writing file data takes a handle from Open or Create
// instead of an inode: the handle records what that open was allowed,
// so access is checked once, at open, as POSIX has it.
syntax = "proto3";

package raft5fs;

service Fs {
  // What the client needs to know before buffering writes.
  rpc Hello(HelloRequest) returns (HelloResponse);
  rpc Login(LoginRequest) returns (LoginResponse);

  // Encrypted filesystems only. The password never reaches the server:
  // the client stretches it with the salt and parameters from Prelogin
  // and logs in with the `auth` half (see raft5fs-crypto's `password`).
  rpc Prelogin(PreloginRequest) returns (PreloginResponse);
  // Sets up an account's keys, once, with a code an administrator issued.
  rpc Enrol(EnrolRequest) returns (EmptyResponse);
  // Replaces an account's password-derived material; the key pair stays.
  rpc ChangePassword(ChangePasswordRequest) returns (EmptyResponse);

  rpc GetAttr(InodeRequest) returns (AttrResponse);
  rpc Lookup(NameRequest) returns (AttrResponse);
  // Both check the caller may access the inode as `mask` asks; Open then
  // hands back a handle carrying that access.
  rpc Open(AccessRequest) returns (OpenResponse);
  rpc Access(AccessRequest) returns (EmptyResponse);
  rpc ReadDir(InodeRequest) returns (ReadDirResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc SetAttr(SetAttrRequest) returns (AttrResponse);
  rpc Mkdir(CreateRequest) returns (AttrResponse);
  // Also opens the new file for reading and writing, whatever its mode.
  rpc Create(CreateRequest) returns (CreateResponse);
  // Both return the inode removed.
  rpc Unlink(NameRequest) returns (InoResponse);
  rpc Rmdir(NameRequest) returns (InoResponse);
  // Returns the inode the move replaced, or 0 if it replaced nothing.
  rpc Rename(RenameRequest) returns (InoResponse);

  // Encrypted filesystems only. There, access is by grant: a user reaches
  // a directory, and everything under it, through a grant of it to them,
  // and only what lies under their grants. Every inode has a key record
  // (raft5fs-crypto's `NodeKeys`), opaque to the server but for its
  // version numbers; a grant carries the granted directory's key sealed
  // to the grantee.
  //
  // An inode number to create with: a node's key record is bound to its
  // inode, so the client needs the number before it can make one.
  rpc AllocateInode(NoArgs) returns (InoResponse);
  // The caller's grant over `ino`, and the key record of every node from
  // that grant's directory down to `ino`: what it takes to unwrap `ino`'s
  // key from scratch.
  rpc GetKeyPath(InodeRequest) returns (KeyPathResponse);
  // Every grant made to the caller: the entries of their root.
  rpc ListGrants(NoArgs) returns (GrantListResponse);
  rpc PublicKey(PublicKeyRequest) returns (PublicKeyResponse);
  // Grants a directory (and all under it) to a user, replacing any grant
  // of it they had. Needs read-write access to it.
  rpc Grant(GrantRequest) returns (EmptyResponse);
  // A new top-level directory, granted read-write to its creator.
  rpc CreateVolume(CreateVolumeRequest) returns (AttrResponse);
  // Removes an empty volume, and every grant of it.
  rpc DeleteVolume(InodeRequest) returns (EmptyResponse);
  // File data, which the client seals chunk by chunk (raft5fs-crypto's
  // `data`), so the server can neither read it nor patch it: Read and
  // Write are refused here, and the client reads, changes and re-seals
  // whole chunks instead. Checked against the caller's grant every time,
  // so these take an inode, not a handle.
  rpc ReadChunks(ReadChunksRequest) returns (ReadChunksResponse);
  // Stores whole sealed chunks, each sealed under the file's current key
  // version. A chunk with an `expected_seq` is stored only if it is still
  // as the client read it -- otherwise nothing is, and the answer is
  // EAGAIN, for the client to read again and redo its change.
  rpc WriteChunks(WriteChunksRequest) returns (AttrResponse);
}

message NoArgs {}

message ReadChunksRequest {
  uint64 ino = 1;
  uint64 first = 2;
  // At most what one write batch holds; more is cut short, and the client
  // asks again from where the answer stopped.
  uint32 count = 3;
}

message SealedChunk {
  uint64 index = 1;
  // The store's sequence number for the chunk as read: what a write of it
  // expects, to be sure nothing changed it meanwhile.
  uint64 seq = 2;
  // Empty for a chunk that was never written: a hole, all zeros.
  bytes blob = 3;
}

message ChunkList {
  // The file's attributes, for its size.
  Attr attr = 1;
  repeated SealedChunk chunks = 2;
}

message ReadChunksResponse {
  oneof result {
    ChunkList list = 1;
    Error error = 2;
  }
}

message ChunkWrite {
  uint64 index = 1;
  // Absent for a chunk being replaced whole, whatever it held.
  optional uint64 expected_seq = 2;
  bytes blob = 3;
}

message WriteChunksRequest {
  uint64 ino = 1;
  repeated ChunkWrite chunks = 2;
  // The file grows to at least this, the end of what was written; 0 to
  // leave its size alone.
  uint64 end = 3;
}

message Error {
  int32 errno = 1;
  string message = 2;
}

// Time since the Unix epoch.
message Timestamp {
  uint64 secs = 1;
  uint32 nanos = 2;
}

enum Kind {
  KIND_FILE = 0;
  KIND_DIRECTORY = 1;
}

message Attr {
  uint64 ino = 1;
  Kind kind = 2;
  uint64 size = 3;
  uint32 perm = 4;
  uint32 nlink = 5;
  uint32 uid = 6;
  uint32 gid = 7;
  Timestamp atime = 8;
  Timestamp mtime = 9;
  Timestamp ctime = 10;
}

message HelloRequest {}

message LoginRequest {
  string username = 1;
  // An unencrypted filesystem's login: checked against the store account.
  string password = 2;
  // An encrypted filesystem's login, in place of the password.
  bytes auth = 3;
}

message Session {
  string token = 1;
  // When the token stops being accepted, in seconds since the Unix epoch.
  uint64 expires_at = 2;
  // Encrypted filesystems: the account's private key, wrapped under the
  // key only the password opens. Empty otherwise.
  bytes wrapped_private_key = 3;
}

message PreloginRequest {
  string username = 1;
}

// How to stretch a password. An account that doesn't exist gets made-up
// settings, the same every time, so this doesn't say which accounts do.
message KdfSettings {
  bytes salt = 1;
  bytes params = 2;
}

message PreloginResponse {
  oneof result {
    KdfSettings settings = 1;
    Error error = 2;
  }
}

// What an encrypted filesystem keeps for an account. The server can check
// a login against `verifier`, and opens nothing.
message AccountKeys {
  bytes salt = 1;
  bytes kdf_params = 2;
  bytes verifier = 3;
  bytes public_key = 4;
  bytes wrapped_private_key = 5;
}

message EnrolRequest {
  string username = 1;
  string code = 2;
  AccountKeys keys = 3;
}

// `keys` must keep the account's public key: only the wrapping changes.
message ChangePasswordRequest {
  string username = 1;
  bytes old_auth = 2;
  AccountKeys keys = 3;
}

message LoginResponse {
  oneof result {
    Session session = 1;
    Error error = 2;
  }
}

message HelloResponse {
  // Fixed for the filesystem's lifetime.
  uint64 chunk_size = 1;
  // How much contiguous data one write transaction stores: the client
  // buffers up to this much and aligns its batches to multiples of it.
  uint64 batch_bytes = 2;
  // Whether the filesystem is encrypted, which changes how to log in.
  bool encrypted = 3;
}

message InodeRequest {
  uint64 ino = 1;
}

// `mask` is access(2)'s: R_OK (4), W_OK (2) and X_OK (1) ORed, or 0 to
// ask only whether the inode exists.
message AccessRequest {
  uint64 ino = 1;
  uint32 mask = 2;
}

message NameRequest {
  uint64 parent = 1;
  // Bytes, not string: a file name needn't be UTF-8.
  bytes name = 2;
}

// On an encrypted filesystem, every `name` is a tag: an HMAC of the real
// name under the directory's name key (raft5fs-crypto's `data`), which
// lets the server find an entry without learning what it is called.
message CreateRequest {
  uint64 parent = 1;
  bytes name = 2;
  uint32 perm = 3;
  // Encrypted filesystems: the inode AllocateInode gave, and its key
  // record, wrapped under the parent's current key.
  uint64 ino = 4;
  bytes node_keys = 5;
  // Encrypted filesystems: the real name, sealed under the parent's key,
  // which listings hand back.
  bytes sealed_name = 6;
}

message RenameRequest {
  uint64 parent = 1;
  bytes name = 2;
  uint64 new_parent = 3;
  bytes new_name = 4;
  // Fail with EEXIST rather than replace an existing `new_name`.
  bool noreplace = 5;
  // Encrypted filesystems, when the parent changes: the moved node's key
  // record, re-wrapped under the new parent's current key, and the inode
  // it is for -- the move is refused if `name` no longer names it.
  bytes node_keys = 6;
  uint64 moved_ino = 7;
  // Encrypted filesystems: `new_name`'s real name, sealed under the new
  // parent's key.
  bytes sealed_new_name = 8;
}

message GrantInfo {
  uint64 ino = 1;
  bool writable = 2;
  // The version of the directory's key the grant holds.
  uint32 key_version = 3;
  // The key, sealed to the grantee.
  bytes sealed_key = 4;
  // What the grant shows up as in the grantee's root, sealed to them.
  bytes sealed_label = 5;
}

message NodeRecord {
  uint64 ino = 1;
  bytes keys = 2;
}

message KeyPath {
  GrantInfo grant = 1;
  // From the granted directory down to the inode asked about.
  repeated NodeRecord nodes = 2;
}

message KeyPathResponse {
  oneof result {
    KeyPath path = 1;
    Error error = 2;
  }
}

message GrantList {
  repeated GrantInfo grants = 1;
}

message GrantListResponse {
  oneof result {
    GrantList list = 1;
    Error error = 2;
  }
}

message PublicKeyRequest {
  string username = 1;
}

message PublicKeyResponse {
  oneof result {
    bytes key = 1;
    Error error = 2;
  }
}

message GrantRequest {
  string username = 1;
  GrantInfo grant = 2;
}

message CreateVolumeRequest {
  // From AllocateInode.
  uint64 ino = 1;
  uint32 perm = 2;
  // Version 1, with no parent key.
  bytes node_keys = 3;
  // The creator's grant: key version 1, sealed to them.
  bytes sealed_key = 4;
  bytes sealed_label = 5;
}

message ReadRequest {
  // From Open or Create, opened for reading.
  string handle = 1;
  uint64 offset = 2;
  uint32 len = 3;
}

message WriteRequest {
  // From Open or Create, opened for writing.
  string handle = 1;
  uint64 offset = 2;
  bytes data = 3;
}

message SetTime {
  oneof time {
    bool now = 1;
    Timestamp at = 2;
  }
}

message SetAttrRequest {
  uint64 ino = 1;
  optional uint32 mode = 2;
  optional uint32 uid = 3;
  optional uint32 gid = 4;
  optional uint64 size = 5;
  SetTime atime = 6;
  SetTime mtime = 7;
  // A handle to `ino` opened for writing, which permits a size change
  // whatever the mode now says (ftruncate).
  optional string handle = 8;
}

message AttrResponse {
  oneof result {
    Attr attr = 1;
    Error error = 2;
  }
}

// Success unless `error` is set.
message EmptyResponse {
  Error error = 1;
}

message OpenResponse {
  oneof result {
    string handle = 1;
    Error error = 2;
  }
}

message Created {
  Attr attr = 1;
  string handle = 2;
}

message CreateResponse {
  oneof result {
    Created created = 1;
    Error error = 2;
  }
}

message InoResponse {
  oneof result {
    uint64 ino = 1;
    Error error = 2;
  }
}

message DirItem {
  uint64 ino = 1;
  Kind kind = 2;
  // On an encrypted filesystem, the entry's tag.
  bytes name = 3;
  // On an encrypted filesystem, the real name, sealed; empty for `.` and
  // `..`, and everywhere on any other filesystem.
  bytes sealed_name = 4;
}

message DirList {
  repeated DirItem items = 1;
}

message ReadDirResponse {
  oneof result {
    DirList list = 1;
    Error error = 2;
  }
}

message ReadResponse {
  oneof result {
    bytes data = 1;
    Error error = 2;
  }
}

// A write that failed part-way: `written` leading bytes were stored
// before `error`.
message WriteFailure {
  uint64 written = 1;
  Error error = 2;
}

message WriteResponse {
  oneof result {
    Attr attr = 1;
    WriteFailure failure = 2;
  }
}
