[package]
name = "raft5fs-proto"
description = "The client/server protocol, and the plain types both ends (and core) share."
version.workspace = true
edition.workspace = true

[features]
# Converts raft5 store errors into `FsError`. Only the server side needs it,
# which is what keeps the FUSE client free of the store client.
raft5 = ["dep:raft5-client"]

[dependencies]
base64 = "0.22"
prost = { workspace = true }
raft5-client = { workspace = true, optional = true }
tonic-prost = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tonic = { workspace = true }

# A browser can't open sockets, so tonic comes without its transport; the
# client speaks gRPC-Web through `fetch` instead. A browser has no clock of
# its own either: `clock::now` asks JavaScript.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
tonic = { version = "0.14", default-features = false, features = ["codegen"] }

[build-dependencies]
tonic-prost-build = { workspace = true }
