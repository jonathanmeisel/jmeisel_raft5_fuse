[workspace]
members = ["core", "crypto", "fuse", "objstore", "proto", "server", "utils"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
raft5fs-core = { path = "core" }
raft5fs-crypto = { path = "crypto" }
raft5fs-proto = { path = "proto" }
raft5fs-server = { path = "server" }
raft5fs-fuse = { path = "fuse" }
raft5fs-objstore = { path = "objstore" }
fuser = "0.18.0"
libc = "0.2"
raft5-client = { git = "https://github.com/jonathanmeisel/jmeisel_raft5", version = "0.1.0" }
raft5-server = { git = "https://github.com/jonathanmeisel/jmeisel_raft5", version = "0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tokio-util = "0.7"
prost = "0.14"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }

# Password hashing (the store's, during logins and account creation) is
# deliberately expensive, and unoptimized it is slow enough to dominate
# the test suite, which logs in for every mount.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
