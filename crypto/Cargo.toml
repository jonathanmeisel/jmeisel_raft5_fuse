[package]
name = "raft5fs-crypto"
description = "Client-side encryption for raft5fs: key derivation, per-inode key records with history, chunk and name encryption, grants sealed to users' public keys. No I/O."
version.workspace = true
edition.workspace = true

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = "0.10"
crypto_box = { version = "0.9", features = ["seal", "chacha20"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
