[package]
name = "raft5fs-indexer"
description = "Search indexing for native clients: the text of files that raft5fs-search can't read alone (PDF), and embeddings with the search models on candle (raft5fs-embed)."
version.workspace = true
edition.workspace = true

[dependencies]
raft5fs-client = { workspace = true }
raft5fs-search = { workspace = true }
pdf-extract = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
tokio = { workspace = true }
# The models, on candle: the same code as the web app's, so the vectors
# agree. Native clients also run the vision side, for photos.
raft5fs-embed = { workspace = true, features = ["vision"] }
ureq = "3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The end-to-end test runs against a real store and servers.
[dev-dependencies]
raft5fs-testkit = { workspace = true }
