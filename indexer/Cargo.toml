[package]
name = "raft5fs-indexer"
description = "Search indexing for native clients: the text of files that raft5fs-search can't read alone (PDF), and embeddings with multilingual-e5-small on ONNX Runtime."
version.workspace = true
edition.workspace = true

[dependencies]
raft5fs-client = { workspace = true }
raft5fs-search = { workspace = true }
pdf-extract = "0.9"
tokio = { workspace = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls", "api-23"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
ureq = "3"
sha2 = "0.10"

# The end-to-end test runs against a real store and servers.
[dev-dependencies]
raft5fs-testkit = { workspace = true }
