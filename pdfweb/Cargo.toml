[package]
name = "raft5fs-pdf-web"
description = "PDF text for the web app's indexer, as its own small WebAssembly module: a PDF that makes the reader panic stops only this module, which the app loads again, not the session."
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
pdf-extract = "0.9"
# lopdf's rand needs this (and the flag in .cargo/config.toml) in a browser.
getrandom = { version = "0.3", features = ["wasm_js"] }
# Pinned with raft5fs-web's: the same wasm-bindgen CLI builds both.
wasm-bindgen = "=0.2.129"
