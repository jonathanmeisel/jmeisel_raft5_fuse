[package]
name = "raft5fs-fuse"
description = "FUSE front end: kernel requests to the client library's session."
version.workspace = true
edition.workspace = true

[dependencies]
fuser = { workspace = true }
libc = { workspace = true }
raft5fs-client = { workspace = true }
raft5fs-proto = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }

# The end-to-end tests run the whole stack: a raft5 cluster, filesystem
# servers on it (as child processes), and mounts on those.
[dev-dependencies]
raft5-client = { workspace = true }
raft5-server = { workspace = true }
raft5fs-core = { workspace = true }
raft5fs-crypto = { workspace = true }
raft5fs-objstore = { workspace = true, features = ["fake"] }
raft5fs-server = { workspace = true }
raft5fs-testkit = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
rcgen = "0.14"
